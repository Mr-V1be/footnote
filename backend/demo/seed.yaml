    # Questions to the norm with their answers, so a fresh stand shows them
    # without a request to the model. Each answer is checked against the
    # corpus on seeding, like a live one: every quote must be in the cited
    # provision of the edition in force. Answers with a `model` are its
    # recorded answers; their quotes are trimmed to the words the answer
    # rests on and footnote markers are placed where the model left them
    # out. The one marked `written` was written from the law's text by the
    # team while the day's model requests were spent.
    questions:
      - asked_by: polyakova@zarya.example
        question: В какой срок нужно прекратить обработку после отзыва согласия?
        asked_hours_ago: 49
        model: nvidia/nemotron-3-super-120b-a12b:free
        answer: >-
          Оператор обязан прекратить обработку персональных данных после отзыва
          согласия в срок, не превышающий тридцати дней с даты поступления отзыва,
          если иное не предусмотрено договором, соглашением или если оператор не
          вправе обрабатывать данные без согласия на основаниях закона.
        citations:
          - anchor: st-21/ch-5
            quote: >-
              оператор обязан прекратить их обработку или обеспечить прекращение
              такой обработки [...] в срок, не превышающий тридцати дней с даты
              поступления указанного отзыва, если иное не предусмотрено договором,
              стороной которого, выгодоприобретателем или поручителем по которому
              является субъект персональных данных, иным соглашением между
              оператором и субъектом персональных данных либо если оператор не
              вправе осуществлять обработку персональных данных без согласия
              субъекта персональных данных на основаниях, предусмотренных настоящим
              Федеральным законом или другими федеральными законами.
      - asked_by: polyakova@zarya.example
        question: В какой срок оператор должен ответить на запрос субъекта персональных данных?
        asked_hours_ago: 26
        model: nvidia/nemotron-3-super-120b-a12b:free
        answer: >-
          Оператор должен ответить на запрос субъекта персональных данных в течение
          десяти рабочих дней с даты получения запроса, с возможным продлением срока
          не более чем на пять рабочих дней при направлении мотивированного
          уведомления с указанием причин продления.
        citations:
          - anchor: st-20/ch-1
            quote: >-
              в течение десяти рабочих дней с даты получения запроса субъекта
              персональных данных или его представителя. Указанный срок может быть
              продлен, но не более чем на пять рабочих дней в случае направления
              оператором в адрес субъекта персональных данных мотивированного
              уведомления с указанием причин продления срока предоставления
              запрашиваемой информации.
      - asked_by: polyakova@zarya.example
        question: В каких случаях нужно согласие в письменной форме?
        asked_hours_ago: 5
        model: written
        answer: >-
          Согласие в письменной форме нужно в случаях, прямо предусмотренных
          федеральным законом [1], — в частности, для обработки специальных
          категорий персональных данных [2] и биометрических персональных данных
          [3]. Согласие в форме электронного документа, подписанного электронной
          подписью, равнозначно согласию на бумаге с собственноручной подписью [1].
        citations:
          - anchor: st-9/ch-4
            quote: >-
              В случаях, предусмотренных федеральным законом, обработка персональных
              данных осуществляется только с согласия в письменной форме субъекта
              персональных данных. Равнозначным содержащему собственноручную подпись
              субъекта персональных данных согласию в письменной форме на бумажном
              носителе признается согласие в форме электронного документа,
              подписанного в соответствии с федеральным законом электронной подписью.
          - anchor: st-10/ch-2/p-1
            quote: субъект персональных данных дал согласие в письменной форме на обработку своих персональных данных
          - anchor: st-11/ch-1
            quote: >-
              могут обрабатываться только при наличии согласия в письменной форме
              субъекта персональных данных
      - asked_by: polyakova@zarya.example
        question: Что делать оператору, если произошла утечка персональных данных?
        asked_hours_ago: 2
        model: nvidia/nemotron-3-super-120b-a12b:free
        answer: >-
          Оператор обязан уведомить уполномоченный орган по защите прав субъектов
          персональных данных в течение 24 часов о произошедшем инциденте, о
          предполагаемых причинах, повлекших нарушение прав субъектов персональных
          данных, и предполагаемом вреде, нанесенном правам субъектов персональных
          данных, о принятых мерах по устранению последствий соответствующего
          инцидента, а также предоставить сведения о лице, уполномоченном
          оператором на взаимодействие с уполномоченным органом по защите прав
          субъектов персональных данных, по вопросам, связанным с выявленным
          инцидентом [1]. В течение 72 часов оператор обязан предоставить
          результаты внутреннего расследования выявленного инцидента и сведения о
          лицах, действия которых стали причиной выявленного инцидента (при
          наличии) [2].
        citations:
          - anchor: st-21/ch-3.1/p-1
            quote: >-
              уведомить уполномоченный орган по защите прав субъектов персональных
              данных: … в течение двадцати четырех часов о произошедшем инциденте
          - anchor: st-21/ch-3.1/p-2
            quote: >-
              в течение семидесяти двух часов о результатах внутреннего
              расследования выявленного инцидента, а также предоставить сведения о
              лицах, действия которых стали причиной выявленного инцидента (при
              наличии)
      - asked_by: ershov@zarya.example
        question: Можно ли обрабатывать персональные данные без согласия, если это нужно для исполнения договора?
        asked_hours_ago: 20
        model: nvidia/nemotron-3-super-120b-a12b:free
        answer: >-
          Да, обработка персональных данных допускается без согласия, если она
          необходима для исполнения договора, стороной которого либо
          выгодоприобретателем или поручителем по которому является субъект
          персональных данных, а также для заключения договора по инициативе
          субъекта персональных данных или договора, по которому субъект
          персональных данных будет являться выгодоприобретателем или поручителем.
        citations:
          - anchor: st-6/ch-1/p-5
            quote: >-
              обработка персональных данных допускается в следующих случаях: …
              обработка персональных данных необходима для исполнения договора,
              стороной которого либо выгодоприобретателем или поручителем по
              которому является субъект персональных данных


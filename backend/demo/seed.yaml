# Demo stand: organizations, members and documents.
#
# Everything here is fictional. The passwords are demo credentials for the
# test roles of the demo stand only. Apply with `snoska demo seed`; the
# command is idempotent (Keycloak objects are ensured, uploads are keyed).

# One-click sign-in on the demo stand (SNOSKA_DEMO_MODE): the seeded account
# each role opens. These accounts keep their roles while the stand is up, and
# the nightly reset returns everything else to this file.
demo_login:
  owner: ershov@zarya.example
  lawyer: polyakova@zarya.example
  observer: gusev@zarya.example
  operator: operator@snoska.example

platform_admin:
  email: operator@snoska.example
  first_name: Ольга
  last_name: Платонова
  password: Snoska-Demo-2026
  realm_role: platform-admin

organizations:
  - alias: polyarnaya-zvezda
    name: ООО «Полярная звезда»
    domain: polyarnaya-zvezda.example
    members:
      - email: kovaleva@polyarnaya-zvezda.example
        first_name: Анна
        last_name: Ковалёва
        password: Snoska-Demo-2026
        role: owner
      - email: orlov@polyarnaya-zvezda.example
        first_name: Михаил
        last_name: Орлов
        password: Snoska-Demo-2026
        role: lawyer
      - email: smirnova@polyarnaya-zvezda.example
        first_name: Дарья
        last_name: Смирнова
        password: Snoska-Demo-2026
        role: executor
      - email: belov@polyarnaya-zvezda.example
        first_name: Игорь
        last_name: Белов
        password: Snoska-Demo-2026
        role: observer
    # Four people do not fit the free plan: the stand starts on "team".
    plan: team
    # A personnel workspace only its members see; inside it Daria uploads and
    # Igor, an observer in the organization, decides on findings as a lawyer.
    workspaces:
      - slug: kadry
        name: Кадры
        restricted: true
        members:
          - email: smirnova@polyarnaya-zvezda.example
            role: executor
          - email: belov@polyarnaya-zvezda.example
            role: lawyer
    documents:
      - file: documents/polyarnaya-zvezda/polozhenie-o-pd-rabotnikov.docx
        kind: regulation
        title: Положение об обработке персональных данных работников
        uploaded_by: smirnova@polyarnaya-zvezda.example
      - file: documents/polyarnaya-zvezda/dogovor-porucheniya-15-2026.pdf
        kind: pd_assignment
        title: Договор поручения обработки ПДн № 15/2026
        uploaded_by: orlov@polyarnaya-zvezda.example
      - file: documents/polyarnaya-zvezda/prikaz-7-od.pdf
        kind: order
        title: Приказ № 7-ОД об утверждении политики
        uploaded_by: smirnova@polyarnaya-zvezda.example
      - file: documents/polyarnaya-zvezda/soglasie-pokupatelya.docx
        kind: pd_consent
        title: Согласие покупателя на обработку ПДн
        uploaded_by: orlov@polyarnaya-zvezda.example
      - file: documents/polyarnaya-zvezda/politika-obrabotki-pd.docx
        kind: pd_policy
        title: Политика в отношении обработки персональных данных
        uploaded_by: orlov@polyarnaya-zvezda.example
      - file: documents/rechnoy-port/soglasie-rabotnika.docx
        kind: pd_consent
        title: Согласие работника на обработку ПДн
        uploaded_by: smirnova@polyarnaya-zvezda.example
        workspace: kadry
    # New versions of documents uploaded above, in order.
    versions:
      - document: documents/polyarnaya-zvezda/polozhenie-o-pd-rabotnikov.docx
        file: documents/polyarnaya-zvezda/polozhenie-o-pd-rabotnikov-red2.docx
        uploaded_by: orlov@polyarnaya-zvezda.example
    # An accounting system's key (its token is shown once and not kept) and
    # a webhook to the stand's own receiver, which checks the signatures.
    integrations:
      api_keys:
        - name: Учётная система
          scopes: [documents:read, documents:write, checks:run]
      webhooks:
        - description: Демо-приёмник
          events: [document.parsed, check.completed, check.failed, finding.reviewed]


[project]
name = "snoska"
version = "0.1.0"
description = "Document compliance checks against 152-FZ and GOST R 7.0.97 with cited norms"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "dramatiq[redis]>=2.2.1",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0",
    "opentelemetry-sdk>=1.45.0",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "pypdfium2>=5.13.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.2",
    "structlog>=26.1.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
snoska = "snoska.cli.main:run"

[build-system]
requires = ["uv_build>=0.9.26,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "lxml-stubs>=0.5.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "PL", "PT",
  "RET", "ARG", "ASYNC", "DTZ", "T20", "PIE", "TID", "ERA", "PERF", "FURB", "LOG", "G",
]
ignore = [
  "PLR0913", "PLR0917",  # use cases and adapters legitimately take several collaborators
  "PLR2004",  # thresholds are named where they carry meaning
  "S101",     # asserts narrow types in handlers and tests
  "RUF001", "RUF002", "RUF003",  # Cyrillic text is the product's language
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR0915", "ARG001"]
"migrations/**" = ["E501", "S608"]
# Strategies of one interface: not every rule or executor needs every argument.
"src/snoska/domain/checks/rules/*.py" = ["ARG002"]
"src/snoska/application/checks/*.py" = ["ARG002"]
"src/snoska/infrastructure/ai/unconfigured.py" = ["ARG002"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["snoska"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["pytesseract.*", "pdfplumber.*", "pdfminer.*", "asyncpg.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
  "integration: needs PostgreSQL (the compose stack or the CI service)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.importlinter]
root_package = "snoska"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point inwards"
type = "layers"
layers = [
  "snoska.cli",
  "snoska.api | snoska.worker",
  "snoska.bootstrap",
  "snoska.infrastructure",
  "snoska.application",
  "snoska.ports",
  "snoska.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["snoska.domain"]
forbidden_modules = [
  "sqlalchemy", "fastapi", "starlette", "httpx", "pydantic", "dramatiq", "redis",
  "asyncpg", "structlog", "docx", "pdfplumber", "lxml",
]

[[tool.importlinter.contracts]]
name = "Application depends on ports, not on frameworks"
type = "forbidden"
source_modules = ["snoska.application", "snoska.ports"]
forbidden_modules = [
  "sqlalchemy", "fastapi", "starlette", "httpx", "pydantic", "dramatiq", "redis", "asyncpg",
]

# Checks against Federal Law No. 152-FZ "On Personal Data".
#
# A language model decides each check from passages of the document found
# for it, next to the provisions named in `anchors` (quoted from the corpus
# edition in force) and the closest other provision of the law. Its answer is
# accepted only with verbatim quotes; otherwise the check asks for a lawyer.
#
# `brief.question` and `brief.criteria` are what the model is asked;
# `brief.search` finds the relevant passages; `brief.keywords` are stems that
# make a passage more likely to be relevant.
family: personal_data
rank: 0
act: 152-fz

kind_groups:
  local_acts: &local_acts [pd_policy, regulation]

checks:
  # Policy and local acts on personal data (art. 18.1).
  - code: personal_data.purposes
    method: model
    kinds: *local_acts
    anchors: [st-18.1/ch-1/p-2, st-5/ch-2]
    severity: critical
    title: Не указаны конкретные цели обработки
    requirement: Документ перечисляет конкретные цели обработки персональных данных.
    recommendation: Перечислите цели обработки — например, исполнение трудовых договоров, оказание услуг клиентам, ведение бухгалтерского учёта.
    brief:
      question: Перечислены ли в документе конкретные цели обработки персональных данных?
      criteria: Названы конкретные цели (исполнение договоров, кадровый учёт, оказание услуг и т. п.), а не общая формулировка вроде «в целях деятельности оператора».
      search: цели обработки персональных данных
      keywords: [цел, целях]

  - code: personal_data.legal_grounds
    method: model
    kinds: *local_acts
    anchors: [st-6/ch-1]
    severity: important
    title: Не указаны правовые основания обработки
    requirement: Документ называет правовые основания обработки персональных данных.
    recommendation: Укажите основания обработки — согласие субъекта, исполнение договора, требования закона — и нормативные акты, во исполнение которых ведётся обработка.
    brief:
      question: Названы ли в документе правовые основания обработки персональных данных?
      criteria: Указаны основания из части 1 статьи 6 (согласие, договор, обязанность по закону и т. п.) или перечислены нормативные акты, на основании которых ведётся обработка.
      search: правовые основания обработки персональных данных
      keywords: [основани, согласи, закон]

  - code: personal_data.data_per_purpose
    method: model
    kinds: *local_acts
    anchors: [st-18.1/ch-1/p-2, st-5/ch-5]
    severity: important
    title: Нет перечня данных для каждой цели
    requirement: Для каждой цели обработки определены категории и перечень персональных данных.
    recommendation: "Для каждой цели перечислите обрабатываемые данные — например, «для кадрового учёта: ФИО, паспортные данные, СНИЛС, ИНН»."
    brief:
      question: Определены ли в документе для каждой цели обработки категории и перечень обрабатываемых персональных данных?
      criteria: Для каждой цели или группы целей указано, какие именно данные обрабатываются; общий перечень допустим, если прямо сказано, что он относится ко всем названным целям.
      search: перечень обрабатываемых персональных данных для каждой цели
      keywords: [перечень, категори, паспорт, фамили]

  - code: personal_data.subject_categories
    method: model
    kinds: *local_acts
    anchors: [st-18.1/ch-1/p-2]
    severity: important
    title: Не названы категории субъектов
    requirement: Документ называет категории субъектов, чьи данные обрабатываются.
    recommendation: Перечислите категории субъектов — работники, кандидаты на работу, клиенты, их представители, контрагенты.
    brief:
      question: Названы ли в документе категории субъектов, персональные данные которых обрабатываются?
      criteria: Перечислены группы людей — работники, кандидаты, клиенты, представители, контрагенты и т. п.
      search: категории субъектов персональных данных
      keywords: [субъект, работник, клиент, кандидат]

  - code: personal_data.terms
    method: model
    kinds: *local_acts
    anchors: [st-18.1/ch-1/p-2, st-5/ch-7]
    severity: important
    title: Не определены сроки обработки и хранения
    requirement: Документ определяет сроки обработки и хранения персональных данных.
    recommendation: Укажите сроки обработки и хранения для каждой цели или порядок их определения — например, «в течение срока действия договора и 5 лет после его окончания».
    brief:
      question: Определены ли в документе сроки обработки и хранения персональных данных?
      criteria: Указаны конкретные сроки или порядок их определения (до достижения цели, срок действия договора, сроки хранения документов по закону). Одна общая фраза «не дольше, чем требуют цели» без сроков — частичное выполнение.
      search: сроки обработки и хранения персональных данных
      keywords: [срок, хранени]

  - code: personal_data.destruction
    method: model
    kinds: *local_acts
    anchors: [st-18.1/ch-1/p-2, st-21/ch-4]
    severity: important
    title: Не описан порядок уничтожения данных
    requirement: Документ описывает, когда и как уничтожаются персональные данные при достижении целей обработки.
    recommendation: Опишите порядок уничтожения — срок (например, 30 дней с достижения цели), способ и как оформляется уничтожение.
    brief:
      question: Описан ли в документе порядок уничтожения персональных данных при достижении целей обработки или при наступлении иных законных оснований?
      criteria: Сказано, когда данные уничтожаются (срок после достижения цели или отзыва согласия) и как это делается или фиксируется.
      search: уничтожение персональных данных при достижении целей обработки
      keywords: [уничтож]

  - code: personal_data.subject_rights
    method: model
    kinds: *local_acts
    anchors: [st-14/ch-1, st-14/ch-7]
    severity: important
    title: Не описаны права субъекта
    requirement: Документ описывает права субъекта персональных данных.
    recommendation: Опишите права субъекта — получать сведения об обработке, требовать уточнения, блокирования или уничтожения данных, отозвать согласие, обжаловать действия оператора.
    brief:
      question: Описаны ли в документе права субъекта персональных данных?
      criteria: Названо право получать сведения об обработке и хотя бы часть других прав — требовать уточнения, блокирования или уничтожения, отозвать согласие, обжаловать действия оператора.
      search: права субъекта персональных данных
      keywords: [прав, вправе]

  - code: personal_data.protection
    method: model
    kinds: *local_acts
    anchors: [st-18.1/ch-1, st-19/ch-2]
    severity: important
    title: Не описаны меры защиты данных
    requirement: Документ описывает правовые, организационные и технические меры защиты персональных данных.
    recommendation: Перечислите меры защиты — назначение ответственного, локальные акты, разграничение доступа, учёт носителей, антивирусная защита, внутренний контроль.
    brief:
      question: Описаны ли в документе меры по обеспечению безопасности персональных данных?
      criteria: Перечислены конкретные меры — назначение ответственного, локальные акты, ограничение доступа, оценка вреда, ознакомление работников, технические средства защиты и т. п.
      search: меры по обеспечению безопасности персональных данных
      keywords: [мер, безопасност, защит]

  - code: personal_data.cross_border
    method: model
    kinds: [pd_policy]
    anchors: [st-12/ch-1, st-12/ch-3]
    severity: advice
    title: Не сказано о трансграничной передаче
    requirement: Политика говорит, передаются ли персональные данные за рубеж и на каких условиях.
    recommendation: Укажите прямо, что трансграничная передача не осуществляется, или опишите её условия и уведомление Роскомнадзора.
    brief:
      question: Сказано ли в документе, осуществляет ли оператор трансграничную передачу персональных данных, и если осуществляет — на каких условиях?
      criteria: Есть прямое указание, что трансграничная передача не осуществляется, или описаны её условия и уведомление уполномоченного органа.
      search: трансграничная передача персональных данных
      keywords: [трансграничн, иностранн]

  - code: personal_data.processor
    method: model
    kinds: [pd_policy]
    anchors: [st-6/ch-3]
    severity: advice
    title: Не сказано о поручении обработки другим лицам
    requirement: Политика говорит, поручает ли оператор обработку другим лицам и на каких условиях.
    recommendation: Укажите, поручается ли обработка другим лицам; если поручается — что это делается по договору с требованиями части 3 статьи 6.
    brief:
      question: Сказано ли в документе, поручает ли оператор обработку персональных данных другим лицам и на каких условиях?
      criteria: Есть указание, что обработка поручается другим лицам на основании договора (поручения) с требованиями к ним, или что не поручается.
      search: поручение обработки персональных данных другому лицу
      keywords: [поруч, третьим лицам, другому лицу]

  - code: personal_data.requests
    method: model
    kinds: [pd_policy]
    anchors: [st-20/ch-1]
    severity: important
    title: Не описано, как субъекту обратиться к оператору
    requirement: Политика описывает, как субъект направляет запрос или отзывает согласие и в какой срок оператор отвечает.
    recommendation: Укажите адрес и e-mail для запросов и срок ответа — 10 рабочих дней.
    brief:
      question: Описано ли в документе, как субъект может обратиться к оператору (запрос, отзыв согласия) и в какой срок оператор отвечает?
      criteria: Указан способ обращения — адрес, e-mail, форма запроса — или срок ответа на запросы субъектов.
      search: запросы и обращения субъектов персональных данных к оператору
      keywords: [запрос, обращени, отзыв]

  - code: personal_data.responsible_person
    method: model
    kinds: *local_acts
    anchors: [st-18.1/ch-1/p-1, st-22.1/ch-1]
    severity: advice
    title: Не назначен ответственный за организацию обработки
    requirement: Документ называет лицо, ответственное за организацию обработки персональных данных.
    recommendation: Укажите, что оператор назначает ответственного за организацию обработки персональных данных, и его обязанности.
    brief:
      question: Сказано ли в документе о лице, ответственном за организацию обработки персональных данных?
      criteria: Упомянуто назначение ответственного за организацию обработки персональных данных (по должности или по имени).
      search: ответственный за организацию обработки персональных данных
      keywords: [ответственн]

  # Consent of the subject (art. 9 part 4).
  - code: personal_data.consent_subject
    method: model
    kinds: [pd_consent]
    anchors: [st-9/ch-4/p-1]
    severity: critical
    title: Нет данных субъекта
    requirement: В согласии есть фамилия, имя, отчество и адрес субъекта, номер документа, удостоверяющего личность, дата выдачи и выдавший орган.
    recommendation: Добавьте поля для ФИО, адреса и реквизитов паспорта — номер, дата выдачи, кем выдан.
    brief:
      question: Есть ли в согласии фамилия, имя, отчество, адрес субъекта и сведения об основном документе, удостоверяющем его личность?
      criteria: Есть поля или текст для ФИО, адреса и номера документа, удостоверяющего личность, с датой выдачи и выдавшим органом.
      search: фамилия имя отчество адрес паспорт субъекта персональных данных
      keywords: [фамили, паспорт, адрес, выдан]

  - code: personal_data.consent_operator
    method: model
    kinds: [pd_consent]
    anchors: [st-9/ch-4/p-3]
    severity: critical
    title: Не указан оператор
    requirement: Согласие называет оператора — наименование и адрес.
    recommendation: Укажите полное наименование оператора и его адрес.
    brief:
      question: Указаны ли в согласии наименование и адрес оператора, получающего согласие?
      criteria: Названы наименование (или ФИО) оператора и его адрес.
      search: наименование и адрес оператора получающего согласие
      keywords: [оператор, адрес]

  - code: personal_data.consent_purpose
    method: model
    kinds: [pd_consent]
    anchors: [st-9/ch-4/p-4, st-9/ch-1]
    severity: critical
    title: Не указана конкретная цель
    requirement: Согласие указывает конкретную цель обработки.
    recommendation: Укажите конкретную цель — например, «оформление и исполнение договора поставки».
    brief:
      question: Указана ли в согласии конкретная цель обработки персональных данных?
      criteria: Названа конкретная цель (одна или несколько), а не «любые цели» или «цели деятельности оператора».
      search: цель обработки персональных данных согласие
      keywords: [цел]

  - code: personal_data.consent_data
    method: model
    kinds: [pd_consent]
    anchors: [st-9/ch-4/p-5]
    severity: critical
    title: Нет перечня данных
    requirement: Согласие перечисляет персональные данные, на обработку которых оно даётся.
    recommendation: Перечислите данные — например, «ФИО, номер телефона, адрес электронной почты».
    brief:
      question: Перечислены ли в согласии персональные данные, на обработку которых оно даётся?
      criteria: Есть конкретный перечень данных, а не «любые персональные данные».
      search: перечень персональных данных на обработку которых дается согласие
      keywords: [перечень, фамили, телефон, адрес]

  - code: personal_data.consent_processor
    method: model
    kinds: [pd_consent]
    anchors: [st-9/ch-4/p-6]
    severity: advice
    title: Не названо лицо, которому поручена обработка
    requirement: Если обработка поручается другому лицу, согласие называет его наименование и адрес.
    recommendation: Укажите наименование и адрес лица, которому поручается обработка, или прямо напишите, что обработка другим лицам не поручается.
    brief:
      question: Названо ли в согласии лицо, которому оператор поручает обработку, с наименованием и адресом — или сказано, что обработка другим лицам не поручается?
      criteria: Есть наименование и адрес лица, обрабатывающего данные по поручению оператора, или прямое указание, что обработка не поручается. Упоминание «третьих лиц» без названия — нарушение.
      search: обработка по поручению оператора наименование и адрес лица
      keywords: [поруч, третьим лицам, адрес]

  - code: personal_data.consent_actions
    method: model
    kinds: [pd_consent]
    anchors: [st-9/ch-4/p-7]
    severity: important
    title: Нет перечня действий с данными
    requirement: Согласие перечисляет действия с данными и описывает способы обработки.
    recommendation: Перечислите действия — сбор, запись, систематизация, хранение, уточнение, удаление — и укажите, ведётся ли обработка автоматизированно.
    brief:
      question: Перечислены ли в согласии действия с персональными данными и описаны ли способы обработки?
      criteria: Перечислены действия (сбор, запись, хранение, уточнение, передача, удаление и т. п.) и сказано, автоматизированная обработка или нет.
      search: перечень действий с персональными данными способы обработки
      keywords: [сбор, запись, хранени, автоматизирован]

  - code: personal_data.consent_term
    method: model
    kinds: [pd_consent]
    anchors: [st-9/ch-4/p-8]
    severity: critical
    title: Нет срока действия и способа отзыва
    requirement: Согласие указывает срок своего действия и способ отзыва.
    recommendation: Укажите срок действия согласия и как его отозвать — например, письменным заявлением по адресу оператора.
    brief:
      question: Указаны ли в согласии срок его действия и способ его отзыва?
      criteria: Есть срок действия согласия и описание, как его отозвать. Срок «бессрочно» без способа отзыва — нарушение.
      search: срок действия согласия и способ его отзыва
      keywords: [срок, отзыв, отозва]

  - code: personal_data.consent_signature
    method: model
    kinds: [pd_consent]
    anchors: [st-9/ch-4/p-9]
    severity: important
    title: Нет места для подписи субъекта
    requirement: В согласии есть место для подписи субъекта.
    recommendation: Добавьте место для подписи субъекта и даты.
    brief:
      question: Есть ли в согласии место для подписи субъекта персональных данных?
      criteria: Есть строка или поле для подписи субъекта (обычно с датой и расшифровкой).
      search: подпись субъекта персональных данных дата
      keywords: [подпис]

  - code: personal_data.consent_specific
    method: model
    kinds: [pd_consent]
    anchors: [st-9/ch-1]
    severity: important
    title: Согласие сформулировано слишком широко
    requirement: Согласие конкретное, предметное, информированное, сознательное и однозначное.
    recommendation: Уберите формулировки «на любые цели», «любым третьим лицам», «бессрочно» и опишите обработку конкретно.
    brief:
      question: Является ли согласие конкретным, предметным, информированным, сознательным и однозначным?
      criteria: Согласие касается определённых целей и данных и не содержит формулировок вроде «на любые цели», «любым третьим лицам», «в том числе для иных целей».
      search: согласие на обработку персональных данных конкретное информированное
      keywords: [любы, иных целей, неограничен]

  # Instruction to process personal data on behalf of the operator (art. 6 part 3).
  - code: personal_data.assignment_data
    method: model
    kinds: [pd_assignment]
    anchors: [st-6/ch-3]
    severity: critical
    title: В поручении нет перечня персональных данных
    requirement: Договор поручения определяет перечень персональных данных.
    recommendation: Перечислите персональные данные, которые обрабатываются по поручению.
    brief:
      question: Определён ли в договоре перечень персональных данных, которые обрабатываются по поручению?
      criteria: Есть конкретный перечень данных (ФИО, телефон, адрес и т. п.) или ссылка на приложение с таким перечнем.
      search: перечень персональных данных обрабатываемых по поручению
      keywords: [перечень, фамили, телефон]

  - code: personal_data.assignment_actions
    method: model
    kinds: [pd_assignment]
    anchors: [st-6/ch-3]
    severity: critical
    title: В поручении нет перечня действий
    requirement: Договор поручения определяет перечень действий с персональными данными.

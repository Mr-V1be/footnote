# Formatting checks: requirements of GOST R 7.0.97-2016 for organizational
# documents, stated in our own words with the clause they come from. The text
# of the standard is not reproduced.
#
# Each entry is a check. `rule` names a deterministic rule of the engine and
# `params` configure it; `kinds` are the document kinds the check applies to.
# A new check is a new entry: the engine does not change.
#
# What a check tells a reader — `title`, `requirement`, `recommendation` and
# the standard's name — is written in every interface language (`ru`, `en`);
# the catalogue is refused at load when a wording is missing.
family: formatting
rank: 1
standard:
  ru: ГОСТ Р 7.0.97-2016
  en: GOST R 7.0.97-2016

# When one rule is broken in most elements of a kind — more than `share` of
# them and at least `min_places`, or in more than `max_local` places — the
# finding is about the document as a whole: the places are counted and shown
# on request, not marked one by one. A check may override any of the three.
spread: {share: 0.5, min_places: 3, max_local: 8}

kind_groups:
  all: &all [pd_policy, pd_consent, pd_assignment, contract, regulation, order, other]
  # Organisational documents that carry the full set of requisites.
  acts: &acts [pd_policy, regulation, order]
  # Documents issued by the organisation (a consent is filled in by a person).
  issued: &issued [pd_policy, pd_assignment, contract, regulation, order]

checks:
  - code: formatting.page_margins
    method: deterministic
    rule: page_margins
    params: {min_left_mm: 20, min_right_mm: 10, min_top_mm: 20, min_bottom_mm: 20, tolerance_mm: 0.5}
    clause: "6.1"
    severity: important
    kinds: *all
    title:
      ru: Поля страницы уже допустимых
      en: Page margins narrower than allowed
    requirement:
      ru: Поля каждой страницы — не меньше 20 мм слева, 10 мм справа, 20 мм сверху и 20 мм снизу.
      en: Every page has margins of at least 20 mm on the left, 10 mm on the right, 20 mm at the top and 20 mm at the bottom.
    recommendation:
      ru: Задайте поля в параметрах страницы — левое 20 мм (30 мм для документов, которые хранятся дольше 10 лет), правое 10 мм, верхнее и нижнее 20 мм.
      en: "Set the margins in the page setup: left 20 mm (30 mm for documents kept longer than 10 years), right 10 mm, top and bottom 20 mm."

  - code: formatting.font_size
    method: deterministic
    rule: body_font_size
    params: {min_pt: 12, max_pt: 14}
    clause: "3.3"
    severity: advice
    kinds: *all
    title:
      ru: Кегль основного текста вне 12–14 пт
      en: Body text font size outside 12–14 pt
    requirement:
      ru: Основной текст набран шрифтом 12, 13 или 14 пт; в таблицах допускается мельче.
      en: Body text is set in 12, 13 or 14 pt; tables may use a smaller size.
    recommendation:
      ru: Установите для основного текста размер шрифта 12–14 пт.
      en: Set the body text font size to 12–14 pt.

  - code: formatting.line_spacing
    method: deterministic
    rule: line_spacing
    params: {min: 1.0, max: 1.5}
    clause: "3.4"
    severity: advice
    kinds: *all
    title:
      ru: Межстрочный интервал вне 1–1,5
      en: Line spacing outside 1–1.5
    requirement:
      ru: Основной текст печатается с межстрочным интервалом от одинарного до полуторного.
      en: Body text is printed with line spacing from single to one and a half.
    recommendation:
      ru: Установите для основного текста межстрочный интервал от 1 до 1,5.
      en: Set the body text line spacing between 1 and 1.5.

  - code: formatting.paragraph_indent
    method: deterministic
    rule: paragraph_indent
    params: {indent_mm: 12.5, tolerance_mm: 1.0}
    clause: "3.4"
    severity: advice
    kinds: *issued
    title:
      ru: Абзацный отступ отличается от 1,25 см
      en: Paragraph indent differs from 1.25 cm
    requirement:
      ru: Абзацы основного текста начинаются с отступа 1,25 см.
      en: Paragraphs of body text start with a 1.25 cm indent.
    recommendation:
      ru: Задайте отступ первой строки абзаца 1,25 см.
      en: Set the first-line indent of paragraphs to 1.25 cm.

  - code: formatting.document_type
    method: deterministic
    rule: requisite_present
    params: {requisite: document_type}
    clause: "5.9"
    severity: important
    kinds: *acts
    title:
      ru: Не указан вид документа
      en: Document type not stated
    requirement:
      ru: В начале документа назван его вид — приказ, положение, политика.
      en: "The document names its type at the top: order, regulation, policy."
    recommendation:
      ru: Укажите вид документа прописными буквами над заголовком.
      en: State the document type in capital letters above the title.

  - code: formatting.date
    method: deterministic
    rule: requisite_present
    params: {requisite: date}
    clause: "5.10"
    severity: important
    kinds: [pd_policy, pd_assignment, contract, regulation, order]
    title:
      ru: Нет даты документа
      en: No document date
    requirement:
      ru: У документа есть дата — подписания или утверждения.
      en: The document has a date, of signing or of approval.
    recommendation:
      ru: Добавьте дату документа; для утверждаемого документа — в гриф утверждения.
      en: Add the document date; for a document that is approved, put it in the approval stamp.

  - code: formatting.registration_number
    method: deterministic
    rule: requisite_present
    params: {requisite: registration_number}
    clause: "5.11"
    severity: important
    kinds: [order]
    title:
      ru: Нет регистрационного номера
      en: No registration number
    requirement:
      ru: Приказ зарегистрирован — у него есть номер.
      en: "The order is registered: it has a number."
    recommendation:
      ru: Присвойте приказу номер по журналу регистрации и укажите его рядом с датой.
      en: Give the order a number from the registration log and put it next to the date.

  - code: formatting.place
    method: deterministic
    rule: requisite_present
    params: {requisite: place}
    clause: "5.13"
    severity: advice
    kinds: [pd_policy, pd_assignment, contract, regulation, order]
    title:
      ru: Не указано место составления
      en: Place of issue not stated
    requirement:
      ru: Указано место составления документа, если его нет в наименовании организации.
      en: The document states where it was drawn up, unless the organization's name already says so.
    recommendation:
      ru: Укажите город, где составлен документ, например «г. Москва».
      en: State the city where the document was drawn up, e.g. “г. Москва” (Moscow).

  - code: formatting.approval_stamp
    method: deterministic
    rule: requisite_present
    params: {requisite: approval_stamp}
    clause: "5.16"
    severity: important
    kinds: [pd_policy, regulation]
    title:
      ru: Нет грифа утверждения
      en: No approval stamp
    requirement:
      ru: Локальный акт утверждён — в правом верхнем углу есть гриф «УТВЕРЖДЕН(А)» или «УТВЕРЖДАЮ» с реквизитами.
      en: "The local act is approved: its top right corner carries the stamp “УТВЕРЖДЕН(А)” (approved) or “УТВЕРЖДАЮ” (I approve) with the details of the approval."
    recommendation:
      ru: Добавьте гриф утверждения с названием распорядительного документа, его датой и номером.
      en: Add an approval stamp with the name of the approving order, its date and number.

  - code: formatting.title
    method: deterministic
    rule: requisite_present
    params: {requisite: title}
    clause: "5.17"
    severity: important
    kinds: [order]
    title:
      ru: Нет заголовка к тексту
      en: No title to the text
    requirement:
      ru: У приказа есть заголовок, который отвечает на вопрос «о чём?» и начинается с «О» («Об»).
      en: The order has a title that says what it is about and starts with “О” or “Об” (on).
    recommendation:
      ru: Добавьте заголовок, например «Об утверждении Политики обработки персональных данных».
      en: Add a title, e.g. “Об утверждении Политики обработки персональных данных” (on approving the personal data policy).

  - code: formatting.signature
    method: deterministic
    rule: requisite_present
    params: {requisite: signature}
    clause: "5.22"
    severity: important
    kinds: [order]
    title:
      ru: Нет подписи
      en: No signature
    requirement:
      ru: Приказ подписан — есть должность, подпись и расшифровка подписи.
      en: "The order is signed: it has the signatory's position, signature and printed name."
    recommendation:
      ru: Добавьте подпись — должность, место для подписи, инициалы и фамилию.
      en: "Add the signature block: position, space for the signature, initials and surname."

  - code: formatting.signature_order
    method: deterministic
    rule: signature_initials_first
    clause: "5.22"
    severity: advice
    kinds: *issued
    title:
      ru: В расшифровке подписи фамилия перед инициалами
      en: Surname before initials in the signature block
    requirement:
      ru: В расшифровке подписи инициалы стоят перед фамилией — «А.С. Ковалёва».
      en: "In the printed name under a signature the initials come before the surname: “А.С. Ковалёва” (A.S. Kovaleva)."
    recommendation:
      ru: Поставьте инициалы перед фамилией.
      en: Put the initials before the surname.

  - code: formatting.date_format
    method: deterministic
    rule: date_format
    clause: "5.10"
    severity: advice
    kinds: *all
    title:
      ru: Дата записана не по стандарту
      en: Date not written to the standard
    requirement:
      ru: Даты записываются цифрами через точку — 05.06.2026 — или словами и цифрами — 5 июня 2026 г.
      en: Dates are written in digits separated by periods, 05.06.2026, or in words and digits, “5 июня 2026 г.” (5 June 2026).
    recommendation:
      ru: Запишите дату в виде ДД.ММ.ГГГГ или «5 июня 2026 г.».
      en: Write the date as DD.MM.YYYY or as “5 июня 2026 г.” (5 June 2026).

  - code: formatting.numbering
    method: deterministic
    rule: numbering_arabic
    params: {max_levels: 4}
    clause: "5.18"
    severity: important
    kinds: *issued
    title:
      ru: Нумерация не арабскими цифрами или глубже четырёх уровней
      en: Numbering not in Arabic numerals or deeper than four levels
    requirement:
      ru: Разделы и пункты нумеруются арабскими цифрами, уровней нумерации — не больше четырёх.
      en: Sections and clauses are numbered in Arabic numerals, with no more than four levels of numbering.
    recommendation:
      ru: Пронумеруйте разделы и пункты арабскими цифрами и сократите вложенность до четырёх уровней.
      en: Number sections and clauses in Arabic numerals and reduce nesting to four levels.

  - code: formatting.numbering_sequence
    method: deterministic
    rule: numbering_sequence
    clause: "5.18"
    severity: advice
    kinds: *all
    title:
      ru: Пропуск или повтор в нумерации
      en: Gap or repeat in numbering
    requirement:
      ru: Номера разделов и пунктов идут подряд, без пропусков и повторов.
      en: Section and clause numbers run in order, without gaps or repeats.
    recommendation:
      ru: Перенумеруйте пункты по порядку.
      en: Renumber the clauses in order.

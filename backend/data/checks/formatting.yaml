# Formatting checks: requirements of GOST R 7.0.97-2016 for organisational
# documents, stated in our own words with the clause they come from. The text
# of the standard is not reproduced.
#
# Each entry is a check. `rule` names a deterministic rule of the engine and
# `params` configure it; `kinds` are the document kinds the check applies to.
# A new check is a new entry: the engine does not change.
family: formatting
rank: 1
standard: ГОСТ Р 7.0.97-2016

# When one rule is broken in most elements of a kind — more than `share` of
# them and at least `min_places`, or in more than `max_local` places — the
# finding is about the document as a whole: the places are counted and shown
# on request, not marked one by one. A check may override any of the three.
spread: {share: 0.5, min_places: 3, max_local: 8}

kind_groups:
  all: &all [pd_policy, pd_consent, pd_assignment, contract, regulation, order, other]
  # Organisational documents that carry the full set of requisites.
  acts: &acts [pd_policy, regulation, order]
  # Documents issued by the organisation (a consent is filled in by a person).
  issued: &issued [pd_policy, pd_assignment, contract, regulation, order]

checks:
  - code: formatting.page_margins
    method: deterministic
    rule: page_margins
    params: {min_left_mm: 20, min_right_mm: 10, min_top_mm: 20, min_bottom_mm: 20, tolerance_mm: 0.5}
    clause: "6.1"
    severity: important
    kinds: *all
    title: Поля страницы уже допустимых
    requirement: Поля каждой страницы — не меньше 20 мм слева, 10 мм справа, 20 мм сверху и 20 мм снизу.
    recommendation: Задайте поля в параметрах страницы — левое 20 мм (30 мм для документов, которые хранятся дольше 10 лет), правое 10 мм, верхнее и нижнее 20 мм.

  - code: formatting.font_size
    method: deterministic
    rule: body_font_size
    params: {min_pt: 12, max_pt: 14}
    clause: "3.3"
    severity: advice
    kinds: *all
    title: Кегль основного текста вне 12–14 пт
    requirement: Основной текст набран шрифтом 12, 13 или 14 пт; в таблицах допускается мельче.
    recommendation: Установите для основного текста размер шрифта 12–14 пт.

  - code: formatting.line_spacing
    method: deterministic
    rule: line_spacing
    params: {min: 1.0, max: 1.5}
    clause: "3.4"
    severity: advice
    kinds: *all
    title: Межстрочный интервал вне 1–1,5
    requirement: Основной текст печатается с межстрочным интервалом от одинарного до полуторного.
    recommendation: Установите для основного текста межстрочный интервал от 1 до 1,5.

  - code: formatting.paragraph_indent
    method: deterministic
    rule: paragraph_indent
    params: {indent_mm: 12.5, tolerance_mm: 1.0}
    clause: "3.4"
    severity: advice
    kinds: *issued
    title: Абзацный отступ отличается от 1,25 см
    requirement: Абзацы основного текста начинаются с отступа 1,25 см.
    recommendation: Задайте отступ первой строки абзаца 1,25 см.

  - code: formatting.document_type
    method: deterministic
    rule: requisite_present
    params: {requisite: document_type}
    clause: "5.9"
    severity: important
    kinds: *acts
    title: Не указан вид документа
    requirement: В начале документа назван его вид — приказ, положение, политика.
    recommendation: Укажите вид документа прописными буквами над заголовком.

  - code: formatting.date
    method: deterministic
    rule: requisite_present
    params: {requisite: date}
    clause: "5.10"
    severity: important
    kinds: [pd_policy, pd_assignment, contract, regulation, order]
    title: Нет даты документа
    requirement: У документа есть дата — подписания или утверждения.
    recommendation: Добавьте дату документа; для утверждаемого документа — в гриф утверждения.

  - code: formatting.registration_number
    method: deterministic
    rule: requisite_present
    params: {requisite: registration_number}
    clause: "5.11"
    severity: important
    kinds: [order]
    title: Нет регистрационного номера
    requirement: Приказ зарегистрирован — у него есть номер.
    recommendation: Присвойте приказу номер по журналу регистрации и укажите его рядом с датой.

  - code: formatting.place
    method: deterministic
    rule: requisite_present
    params: {requisite: place}
    clause: "5.13"
    severity: advice
    kinds: [pd_policy, pd_assignment, contract, regulation, order]
    title: Не указано место составления
    requirement: Указано место составления документа, если его нет в наименовании организации.
    recommendation: Укажите город, где составлен документ, например «г. Москва».

  - code: formatting.approval_stamp
    method: deterministic
    rule: requisite_present
    params: {requisite: approval_stamp}
    clause: "5.16"
    severity: important
    kinds: [pd_policy, regulation]
    title: Нет грифа утверждения
    requirement: Локальный акт утверждён — в правом верхнем углу есть гриф «УТВЕРЖДЕН(А)» или «УТВЕРЖДАЮ» с реквизитами.
    recommendation: Добавьте гриф утверждения с названием распорядительного документа, его датой и номером.

  - code: formatting.title
    method: deterministic
    rule: requisite_present
    params: {requisite: title}
    clause: "5.17"
    severity: important
    kinds: [order]
    title: Нет заголовка к тексту
    requirement: У приказа есть заголовок, который отвечает на вопрос «о чём?» и начинается с «О» («Об»).
    recommendation: Добавьте заголовок, например «Об утверждении Политики обработки персональных данных».

  - code: formatting.signature
    method: deterministic
    rule: requisite_present
    params: {requisite: signature}
    clause: "5.22"
    severity: important
    kinds: [order]
    title: Нет подписи
    requirement: Приказ подписан — есть должность, подпись и расшифровка подписи.
    recommendation: Добавьте подпись — должность, место для подписи, инициалы и фамилию.

  - code: formatting.signature_order
    method: deterministic
    rule: signature_initials_first
    clause: "5.22"
    severity: advice
    kinds: *issued
    title: В расшифровке подписи фамилия перед инициалами
    requirement: В расшифровке подписи инициалы стоят перед фамилией — «А.С. Ковалёва».
    recommendation: Поставьте инициалы перед фамилией.

  - code: formatting.date_format
    method: deterministic
    rule: date_format
    clause: "5.10"
    severity: advice
    kinds: *all
    title: Дата записана не по стандарту
    requirement: Даты записываются цифрами через точку — 05.06.2026 — или словами и цифрами — 5 июня 2026 г.
    recommendation: Запишите дату в виде ДД.ММ.ГГГГ или «5 июня 2026 г.».

  - code: formatting.numbering
    method: deterministic
    rule: numbering_arabic
    params: {max_levels: 4}
    clause: "5.18"
    severity: important
    kinds: *issued
    title: Нумерация не арабскими цифрами или глубже четырёх уровней
    requirement: Разделы и пункты нумеруются арабскими цифрами, уровней нумерации — не больше четырёх.
    recommendation: Пронумеруйте разделы и пункты арабскими цифрами и сократите вложенность до четырёх уровней.

  - code: formatting.numbering_sequence
    method: deterministic
    rule: numbering_sequence
    clause: "5.18"
    severity: advice
    kinds: *all
    title: Пропуск или повтор в нумерации
    requirement: Номера разделов и пунктов идут подряд, без пропусков и повторов.
    recommendation: Перенумеруйте пункты по порядку.

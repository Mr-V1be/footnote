name: snoska

# Local infrastructure for development and the demo stand.
# Every published port is bound to loopback and lives in the 46300–46399 range.

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      FOOTNOTE_DB_OWNER_PASSWORD: ${FOOTNOTE_DB_OWNER_PASSWORD:?set FOOTNOTE_DB_OWNER_PASSWORD in .env}
      FOOTNOTE_DB_APP_PASSWORD: ${FOOTNOTE_DB_APP_PASSWORD:?set FOOTNOTE_DB_APP_PASSWORD in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=120
    ports:
      - "127.0.0.1:${FOOTNOTE_DB_PORT:-46310}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${FOOTNOTE_REDIS_PASSWORD:?set FOOTNOTE_REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${FOOTNOTE_REDIS_PORT:-46311}:6379"
    volumes:
      - redisdata:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${FOOTNOTE_REDIS_PASSWORD}

  keycloak:
    image: keycloak/keycloak:26.8.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: http://localhost:${FOOTNOTE_KEYCLOAK_PORT:-46320}
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info
      # Placeholders resolved inside the realm import file.
      FOOTNOTE_WEB_URL: ${FOOTNOTE_WEB_URL:-http://localhost:46300}
      FOOTNOTE_WEB_CLIENT_SECRET: ${FOOTNOTE_WEB_CLIENT_SECRET:?set FOOTNOTE_WEB_CLIENT_SECRET in .env}
      FOOTNOTE_DIRECTORY_CLIENT_SECRET: ${FOOTNOTE_DIRECTORY_CLIENT_SECRET:?set FOOTNOTE_DIRECTORY_CLIENT_SECRET in .env}
      FOOTNOTE_DEMO_CLIENT_SECRET: ${FOOTNOTE_DEMO_CLIENT_SECRET:?set FOOTNOTE_DEMO_CLIENT_SECRET in .env}
      FOOTNOTE_SMTP_PORT: "1025"
    ports:
      - "127.0.0.1:${FOOTNOTE_KEYCLOAK_PORT:-46320}:8080"
    volumes:
      - ./infra/keycloak/realm-footnote.json:/opt/keycloak/data/import/realm-footnote.json:ro
      - ./infra/keycloak/themes/footnote:/opt/keycloak/themes/footnote:ro
    mem_limit: 1g
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # S3-compatible object storage for uploads and generated files. MinIO no
  # longer publishes its own images; Chainguard builds the official source
  # and publishes the current release under `latest`.
  minio:
    image: chainguard/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${FOOTNOTE_S3_ACCESS_KEY:?set FOOTNOTE_S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${FOOTNOTE_S3_SECRET_KEY:?set FOOTNOTE_S3_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:${FOOTNOTE_MINIO_PORT:-46340}:9000"
      - "127.0.0.1:${FOOTNOTE_MINIO_CONSOLE_PORT:-46341}:9001"
    volumes:
      - miniodata:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FOOTNOTE_MAILPIT_UI_PORT:-46330}:8025"
      - "127.0.0.1:${FOOTNOTE_MAILPIT_SMTP_PORT:-46331}:1025"
    mem_limit: 128m

networks:
  default:
    # The host's default address pools are exhausted by other stacks, so the
    # project pins its own small subnet.
    ipam:
      config:
        - subnet: 10.239.163.0/27

volumes:
  pgdata:
  redisdata:
  miniodata:

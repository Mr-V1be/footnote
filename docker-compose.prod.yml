name: snoska-prod

# Production stack on one server: Caddy terminates TLS and is the only
# service with published ports; everything else talks over the private
# network. Configuration and secrets come from .env.prod (template:
# infra/prod/env.example). Rollout: docs/deploy.md.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.prod --profile demo up -d

x-logging: &logging
  # Docker keeps at most 5 × 10 MB of each container's log.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-env: &backend-env
  FOOTNOTE_WEB_URL: ${FOOTNOTE_WEB_URL:?set FOOTNOTE_WEB_URL}
  FOOTNOTE_API_URL: http://api:8000
  FOOTNOTE_DB_HOST: postgres
  FOOTNOTE_DB_PORT: "5432"
  FOOTNOTE_DB_NAME: footnote
  FOOTNOTE_DB_OWNER_PASSWORD: ${FOOTNOTE_DB_OWNER_PASSWORD:?set FOOTNOTE_DB_OWNER_PASSWORD}
  FOOTNOTE_DB_APP_PASSWORD: ${FOOTNOTE_DB_APP_PASSWORD:?set FOOTNOTE_DB_APP_PASSWORD}
  FOOTNOTE_DB_POOL_SIZE: ${FOOTNOTE_DB_POOL_SIZE:-5}
  FOOTNOTE_DB_MAX_OVERFLOW: ${FOOTNOTE_DB_MAX_OVERFLOW:-5}
  FOOTNOTE_REDIS_HOST: redis
  FOOTNOTE_REDIS_PORT: "6379"
  FOOTNOTE_REDIS_PASSWORD: ${FOOTNOTE_REDIS_PASSWORD:?set FOOTNOTE_REDIS_PASSWORD}
  FOOTNOTE_KEYCLOAK_URL: ${FOOTNOTE_KEYCLOAK_URL:?set FOOTNOTE_KEYCLOAK_URL}
  FOOTNOTE_KEYCLOAK_INTERNAL_URL: http://keycloak:8080${KEYCLOAK_PATH:-}
  FOOTNOTE_KEYCLOAK_REALM: footnote
  FOOTNOTE_DIRECTORY_CLIENT_SECRET: ${FOOTNOTE_DIRECTORY_CLIENT_SECRET:?set FOOTNOTE_DIRECTORY_CLIENT_SECRET}
  FOOTNOTE_SECRETS_KEY: ${FOOTNOTE_SECRETS_KEY:?set FOOTNOTE_SECRETS_KEY}
  # Webhooks go to public https addresses only; a demo stand also sends
  # them to its own receiver on the private network.
  FOOTNOTE_WEBHOOKS_ALLOW_PRIVATE: ${FOOTNOTE_DEMO_MODE:-false}
  FOOTNOTE_DEMO_MODE: ${FOOTNOTE_DEMO_MODE:-false}
  FOOTNOTE_DEMO_RECEIVER: ${FOOTNOTE_DEMO_MODE:-false}
  FOOTNOTE_DEMO_RESET_HOUR: ${FOOTNOTE_DEMO_RESET_HOUR:-3}
  FOOTNOTE_PAYMENTS_PROVIDER: ${FOOTNOTE_PAYMENTS_PROVIDER:-test}
  FOOTNOTE_PAYMENTS_TEST_SECRET: ${FOOTNOTE_PAYMENTS_TEST_SECRET:-}
  FOOTNOTE_AI_PROVIDER: ${FOOTNOTE_AI_PROVIDER:-none}
  FOOTNOTE_LLM_BASE_URL: ${FOOTNOTE_LLM_BASE_URL:-}
  FOOTNOTE_LLM_API_KEY: ${FOOTNOTE_LLM_API_KEY:-}
  FOOTNOTE_LLM_MODEL: ${FOOTNOTE_LLM_MODEL:-}
  FOOTNOTE_LLM_FALLBACK_MODELS: ${FOOTNOTE_LLM_FALLBACK_MODELS:-}
  FOOTNOTE_LLM_EXTRA_BODY: ${FOOTNOTE_LLM_EXTRA_BODY:-}
  FOOTNOTE_LLM_REQUESTS_PER_MINUTE: ${FOOTNOTE_LLM_REQUESTS_PER_MINUTE:-0}
  FOOTNOTE_LLM_REQUESTS_PER_DAY: ${FOOTNOTE_LLM_REQUESTS_PER_DAY:-0}
  FOOTNOTE_EMBEDDING_BASE_URL: ${FOOTNOTE_EMBEDDING_BASE_URL:-}
  FOOTNOTE_EMBEDDING_API_KEY: ${FOOTNOTE_EMBEDDING_API_KEY:-}
  FOOTNOTE_EMBEDDING_MODEL: ${FOOTNOTE_EMBEDDING_MODEL:-}
  FOOTNOTE_EMBEDDING_DIMENSIONS: ${FOOTNOTE_EMBEDDING_DIMENSIONS:-}
  FOOTNOTE_STORAGE_BACKEND: local
  FOOTNOTE_STORAGE_ROOT: /app/var/blobs
  FOOTNOTE_SMTP_HOST: ${FOOTNOTE_SMTP_HOST:?set FOOTNOTE_SMTP_HOST}
  FOOTNOTE_SMTP_PORT: ${FOOTNOTE_SMTP_PORT:-587}
  FOOTNOTE_SMTP_SENDER: ${FOOTNOTE_SMTP_SENDER:?set FOOTNOTE_SMTP_SENDER}
  FOOTNOTE_SMTP_USERNAME: ${FOOTNOTE_SMTP_USERNAME:-}
  FOOTNOTE_SMTP_PASSWORD: ${FOOTNOTE_SMTP_PASSWORD:-}
  FOOTNOTE_SMTP_START_TLS: ${FOOTNOTE_SMTP_START_TLS:-true}
  FOOTNOTE_LOG_LEVEL: ${FOOTNOTE_LOG_LEVEL:-INFO}

x-backend: &backend
  # One image for the API, the worker and the one-off commands; the api
  # service builds it.
  image: ${FOOTNOTE_IMAGE_PREFIX:-snoska}-backend:${FOOTNOTE_VERSION:-latest}
  pull_policy: never
  environment: *backend-env
  volumes:
    - blobs:/app/var/blobs
  logging: *logging
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      FOOTNOTE_DB_OWNER_PASSWORD: ${FOOTNOTE_DB_OWNER_PASSWORD}
      FOOTNOTE_DB_APP_PASSWORD: ${FOOTNOTE_DB_APP_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=150"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    logging: *logging
    restart: unless-stopped

  redis:
    image: redis:8.10.2-alpine
    command:
      - redis-server
      - --requirepass
      - ${FOOTNOTE_REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDIS_PASSWORD: ${FOOTNOTE_REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 320m
    logging: *logging
    restart: unless-stopped

  # Built ahead of time from infra/keycloak/Dockerfile: the realm and the login theme are
  # inside the image, build options (database, health, features) are fixed there.
  keycloak:
    image: ${FOOTNOTE_IMAGE_PREFIX:-snoska}-keycloak:${FOOTNOTE_VERSION:-latest}
    build:
      context: .
      dockerfile: infra/keycloak/Dockerfile
      args:
        # Keycloak under a path of the product's name (KEYCLOAK_PATH, e.g. /auth); empty: on
        # a name of its own, as FOOTNOTE_KEYCLOAK_URL says.
        KEYCLOAK_HTTP_RELATIVE_PATH: ${KEYCLOAK_PATH:-/}
    pull_policy: missing
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_DB_POOL_MAX_SIZE: ${KEYCLOAK_DB_POOL_MAX_SIZE:-100}
      # One node: the local cache, no cluster discovery.
      KC_CACHE: local
      # Heap of the JVM; empty keeps Keycloak's default, 70% of the container's limit.
      JAVA_OPTS_KC_HEAP: ${KEYCLOAK_HEAP_OPTIONS:-}
      JAVA_OPTS_APPEND: ${KEYCLOAK_JAVA_OPTIONS:-}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      # Browsers and token issuers use the public URL; the servers reach
      # the back-channel endpoints at keycloak:8080 on the private network.
      KC_HOSTNAME: ${FOOTNOTE_KEYCLOAK_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_LOG_LEVEL: info
      # Placeholders of the realm file.
      FOOTNOTE_WEB_URL: ${FOOTNOTE_WEB_URL}
      FOOTNOTE_WEB_CLIENT_SECRET: ${FOOTNOTE_WEB_CLIENT_SECRET:?set FOOTNOTE_WEB_CLIENT_SECRET}
      FOOTNOTE_DIRECTORY_CLIENT_SECRET: ${FOOTNOTE_DIRECTORY_CLIENT_SECRET}
      # Random even without the demo: the demo client is never left open.
      FOOTNOTE_DEMO_CLIENT_SECRET: ${FOOTNOTE_DEMO_CLIENT_SECRET:?set FOOTNOTE_DEMO_CLIENT_SECRET}
      FOOTNOTE_SMTP_HOST: ${FOOTNOTE_SMTP_HOST}
      FOOTNOTE_SMTP_PORT: ${FOOTNOTE_SMTP_PORT:-587}
      FOOTNOTE_SMTP_FROM: ${FOOTNOTE_SMTP_FROM:?set FOOTNOTE_SMTP_FROM}
      FOOTNOTE_SMTP_AUTH: ${FOOTNOTE_SMTP_AUTH:-true}
      FOOTNOTE_SMTP_USERNAME: ${FOOTNOTE_SMTP_USERNAME:-}
      FOOTNOTE_SMTP_PASSWORD: ${FOOTNOTE_SMTP_PASSWORD:-}
      FOOTNOTE_SMTP_START_TLS: ${FOOTNOTE_SMTP_START_TLS:-true}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 1g
    logging: *logging
    restart: unless-stopped

  # Migrations run on every rollout, before the API and the worker start.
  migrate:
    <<: *backend
    command: ["footnote", "db", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  api:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    pull_policy: missing
    command: ["footnote", "api"]
    environment:
      <<: *backend-env
      FOOTNOTE_API_WORKERS: ${FOOTNOTE_API_WORKERS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    mem_limit: 1g

  worker:
    <<: *backend
    command: ["footnote", "worker"]
    environment:
      <<: *backend-env
      FOOTNOTE_WORKER_THREADS: ${FOOTNOTE_WORKER_THREADS:-4}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:46302/metrics', timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1536m

  web:
    image: ${FOOTNOTE_IMAGE_PREFIX:-snoska}-web:${FOOTNOTE_VERSION:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      FOOTNOTE_WEB_URL: ${FOOTNOTE_WEB_URL}
      FOOTNOTE_API_URL: http://api:8000
      FOOTNOTE_KEYCLOAK_URL: ${FOOTNOTE_KEYCLOAK_URL}
      FOOTNOTE_KEYCLOAK_INTERNAL_URL: http://keycloak:8080${KEYCLOAK_PATH:-}
      FOOTNOTE_KEYCLOAK_REALM: footnote
      FOOTNOTE_WEB_CLIENT_SECRET: ${FOOTNOTE_WEB_CLIENT_SECRET}
      FOOTNOTE_SESSION_SECRET: ${FOOTNOTE_SESSION_SECRET:?set FOOTNOTE_SESSION_SECRET}
      FOOTNOTE_REDIS_HOST: redis
      FOOTNOTE_REDIS_PORT: "6379"
      FOOTNOTE_REDIS_PASSWORD: ${FOOTNOTE_REDIS_PASSWORD}
      FOOTNOTE_DEMO_MODE: ${FOOTNOTE_DEMO_MODE:-false}
      FOOTNOTE_DEMO_CLIENT_SECRET: ${FOOTNOTE_DEMO_CLIENT_SECRET:-}
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m
    logging: *logging
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      FOOTNOTE_DOMAIN: ${FOOTNOTE_DOMAIN:?set FOOTNOTE_DOMAIN}
      FOOTNOTE_AUTH_DOMAIN: ${FOOTNOTE_AUTH_DOMAIN:?set FOOTNOTE_AUTH_DOMAIN}
      FOOTNOTE_ACME_EMAIL: ${FOOTNOTE_ACME_EMAIL:?set FOOTNOTE_ACME_EMAIL}
      FOOTNOTE_HTTP_PORT: ${FOOTNOTE_HTTP_PORT:-80}
      FOOTNOTE_HTTPS_PORT: ${FOOTNOTE_HTTPS_PORT:-443}
    ports:
      - "${FOOTNOTE_BIND:-0.0.0.0}:${FOOTNOTE_HTTP_PORT:-80}:${FOOTNOTE_HTTP_PORT:-80}"
      - "${FOOTNOTE_BIND:-0.0.0.0}:${FOOTNOTE_HTTPS_PORT:-443}:${FOOTNOTE_HTTPS_PORT:-443}"
      - "${FOOTNOTE_BIND:-0.0.0.0}:${FOOTNOTE_HTTPS_PORT:-443}:${FOOTNOTE_HTTPS_PORT:-443}/udp"
    volumes:
      - ./infra/prod/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
      - keycloak
    mem_limit: 256m
    logging: *logging
    restart: unless-stopped

  backup:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    entrypoint: ["/usr/local/bin/backup.sh"]
    environment:
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      FOOTNOTE_BACKUP_HOUR: ${FOOTNOTE_BACKUP_HOUR:-2}
      FOOTNOTE_BACKUP_KEEP_DAYS: ${FOOTNOTE_BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./infra/prod/backup.sh:/usr/local/bin/backup.sh:ro
      - ${FOOTNOTE_BACKUP_DIR:-./backups}:/backups
      - blobs:/blobs:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    logging: *logging
    restart: unless-stopped

  # Demo stand only (profile "demo", with FOOTNOTE_DEMO_MODE=true): the
  # nightly return of the seeded organizations to the seed.
  demo-reset:
    <<: *backend
    command: ["footnote", "demo", "nightly"]
    profiles: ["demo"]
    mem_limit: 512m
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true

networks:
  default:
    ipam:
      config:
        - subnet: ${FOOTNOTE_SUBNET:-10.239.163.32/27}

volumes:
  pgdata:
  redisdata:
  blobs:
  caddydata:
  caddyconfig:

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-superuser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Throwaway credentials of the CI database service.
      POSTGRES_USER: postgres
      PGHOST: localhost
      PGPASSWORD: ci-superuser
      FOOTNOTE_DB_OWNER_PASSWORD: ci-owner
      FOOTNOTE_DB_APP_PASSWORD: ci-app
      KEYCLOAK_DB_PASSWORD: ci-keycloak
      FOOTNOTE_DB_HOST: localhost
      FOOTNOTE_DB_PORT: "5432"
      FOOTNOTE_DB_NAME: snoska_test
      FOOTNOTE_TEST_S3_ENDPOINT: 127.0.0.1:9000
      FOOTNOTE_TEST_S3_ACCESS_KEY: ci-access
      FOOTNOTE_TEST_S3_SECRET_KEY: ci-secret-key
      FOOTNOTE_SECRETS_KEY: ci-secrets-key
    steps:
      - uses: actions/checkout@v7
      - name: Tesseract with Russian data
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-rus
      - name: Database roles and extensions
        run: bash infra/postgres/initdb/10-snoska.sh
      - name: Object storage for the S3 adapter's contract tests
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ci-access -e MINIO_ROOT_PASSWORD=ci-secret-key \
            chainguard/minio:latest server /data
          for _ in $(seq 30); do curl -sf http://127.0.0.1:9000/minio/health/ready && break; sleep 1; done
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Python environment
        working-directory: backend
        run: uv sync --frozen
      - name: Gate
        run: scripts/gate.sh backend

  frontend:
    name: Frontend gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Gate
        run: scripts/gate.sh frontend
      - name: Production build
        working-directory: frontend
        run: pnpm build

  stack:
    name: Production stack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Compose file of the production stack is valid
        run: |
          sed -E 's/^([A-Z_]+)=$/\1=ci-placeholder/' infra/prod/env.example > "$RUNNER_TEMP/ci.env"
          docker compose -f docker-compose.prod.yml --env-file "$RUNNER_TEMP/ci.env" --profile demo config --quiet
      - name: Keycloak image is built with its options fixed
        run: |
          docker build -f infra/keycloak/Dockerfile -t snoska-keycloak:ci .
          docker run --rm snoska-keycloak:ci show-config | tee "$RUNNER_TEMP/keycloak.txt"
          grep -q 'kc.db =  postgres (Persisted)' "$RUNNER_TEMP/keycloak.txt"
          grep -q 'kc.health-enabled =  true (Persisted)' "$RUNNER_TEMP/keycloak.txt"
      - name: Keycloak image under a path keeps its health check at the root
        run: |
          docker build -f infra/keycloak/Dockerfile --build-arg KEYCLOAK_HTTP_RELATIVE_PATH=/auth -t snoska-keycloak:ci-path .
          docker run --rm snoska-keycloak:ci-path show-config | tee "$RUNNER_TEMP/keycloak-path.txt"
          grep -q 'kc.http-relative-path =  /auth (Persisted)' "$RUNNER_TEMP/keycloak-path.txt"
          grep -q 'kc.http-management-relative-path =  / (Persisted)' "$RUNNER_TEMP/keycloak-path.txt"
